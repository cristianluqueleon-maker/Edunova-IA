{% extends 'base.html' %}{% block title %}Estudiantes{% endblock %}{% block content %}<section class="panel"><h3>Agregar estudiante</h3><form class="formrow" method="post"><label>Nombres<input name="first" required></label><label>Apellidos<input name="last" required></label><label>Grado<input name="grade" value="6°" required></label><label>Grupo<input name="group_name" value="A" required></label><button>Guardar</button></form></section><section class="panel"><h3>Estudiantes registrados</h3><table><tr><th>Nombre</th><th>Grado</th><th>Grupo</th><th></th></tr>{% for s in students %}<tr><td>{{s.first}} {{s.last}}</td><td>{{s.grade}}</td><td>{{s.group_name}}</td><td><form method="post" action="/students/{{s.id}}/delete" onsubmit="return confirm('¿Eliminar?')"><button class="danger">Eliminar</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
